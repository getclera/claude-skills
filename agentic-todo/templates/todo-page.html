<title>Agentic ToDo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: "command deck". Hero = photo inside a live progress ring + oversized serif greeting; Today is the big card; week/later quieter; done drawer */
:root{
  --bg:#eef0ea; --surface:#ffffff; --raise:#f7f8f4; --fg:#121612; --muted:#6a736c; --line:#dce0d8;
  --lime:#b8f04a; --ink:#0d1a12; --green:#1d7a4c; --soft:#e2f1e6; --warn:#c2552b;
  --deck:#0d1a12; --deck-2:#14281c; --deck-fg:#f1f6ef; --deck-mute:#9fb6a7;
  --serif:"Instrument Serif",ui-serif,Georgia,serif;
  --sans:"Geist",ui-sans-serif,system-ui,sans-serif;
  --mono:"Geist Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#090c0a; --surface:#121714; --raise:#171e19; --fg:#ecf2ed; --muted:#8c9a91; --line:#232b25;
  --green:#7fdca5; --soft:#15241a; --warn:#ef9a73; --deck:#0f1d14; --deck-2:#183323; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#090c0a; --surface:#121714; --raise:#171e19; --fg:#ecf2ed; --muted:#8c9a91; --line:#232b25;
  --green:#7fdca5; --soft:#15241a; --warn:#ef9a73; --deck:#0f1d14; --deck-2:#183323; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 80px}
.wrap{max-width:700px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* ---------- deck ---------- */
.deck{position:relative;overflow:hidden;border-radius:24px;padding:24px 22px 20px;color:var(--deck-fg);
  background:radial-gradient(120% 140% at 100% 0%,var(--deck-2) 0%,var(--deck) 55%);isolation:isolate}
.deck::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.5;
  background-image:linear-gradient(rgba(184,240,74,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(184,240,74,.07) 1px,transparent 1px);
  background-size:28px 28px;mask-image:linear-gradient(180deg,#000 0%,transparent 85%)}
.deck::after{content:"";position:absolute;width:260px;height:260px;right:-90px;top:-110px;z-index:-1;border-radius:50%;
  background:radial-gradient(circle,rgba(184,240,74,.35),transparent 65%);filter:blur(10px)}
.top{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .track{stroke:rgba(255,255,255,.12)}
.ring .prog{stroke:var(--lime);stroke-linecap:round;stroke-dasharray:283;stroke-dashoffset:283;filter:drop-shadow(0 0 6px rgba(184,240,74,.6))}
@media (prefers-reduced-motion:no-preference){.ring .prog{transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}}
.ring img{position:absolute;inset:9px;width:78px;height:78px;border-radius:50%;object-fit:cover}
.pct{position:absolute;right:-4px;bottom:-2px;background:var(--lime);color:var(--ink);font:600 11px/1 var(--mono);padding:4px 6px;border-radius:99px;border:2px solid var(--deck)}
.hello{min-width:0}
.date{font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--deck-mute)}
h1{font:400 clamp(34px,8vw,48px)/.95 var(--serif);margin:8px 0 0;letter-spacing:-.01em;text-wrap:balance}
h1 em{color:var(--lime);font-style:italic}
.line{margin:20px 0 0;font-size:14px;color:var(--deck-mute)}
.line b{color:var(--deck-fg);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:16px;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.08)}
.stat{background:rgba(13,26,18,.55);padding:12px 14px;backdrop-filter:blur(4px)}
.stat b{display:block;font:400 32px/1 var(--serif);font-variant-numeric:tabular-nums}
.stat span{font:500 10.5px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--deck-mute)}
.stat.hot b{color:var(--lime)}

/* ---------- add ---------- */
form{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 6px 6px 14px;box-shadow:0 1px 0 var(--line)}
form:focus-within{border-color:var(--green)}
.plus{font:400 22px/1 var(--serif);color:var(--muted)}
#newTitle{flex:1 1 auto;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;font-size:16px;padding:10px 4px;outline:none}
.seg{display:flex;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{font:500 12px/1 var(--sans);padding:8px 9px;border-radius:8px;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg input:checked+label{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg input:focus-visible+label{outline:2px solid var(--green)}
button{font:inherit;color:var(--fg);background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:7px 11px;cursor:pointer}
button.primary{background:var(--ink);border-color:var(--ink);color:var(--lime);font-weight:600;padding:10px 14px}
:root:not([data-theme="light"]) button.primary{}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
@media (max-width:480px){form{flex-wrap:wrap;padding:8px}#newTitle{flex-basis:100%}.seg{flex:1}.seg label{flex:1;text-align:center}}

/* ---------- lists ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 10px 10px}
.quiet{padding:4px 2px}
h2{display:flex;align-items:baseline;gap:10px;margin:0 8px 8px;font:400 26px/1 var(--serif)}
.quiet h2{font-size:20px;color:var(--muted)}
h2 .n{font:500 11px/1 var(--mono);letter-spacing:.08em;color:var(--muted)}
h2 .n:empty{display:none}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
li{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:10px 8px;border-radius:12px;position:relative}
li:hover{background:var(--raise)}
li .t{min-width:0;overflow-wrap:anywhere;cursor:pointer;font-weight:500}
li.done .t{color:var(--muted);text-decoration:line-through;font-weight:400}
.plan{display:block;font-size:13px;font-weight:400;color:var(--muted);margin-top:3px}
.src{display:inline-flex;align-items:center;gap:5px;font:500 10.5px/1 var(--mono);letter-spacing:.04em;color:var(--muted);margin-top:6px;padding:4px 7px;border-radius:99px;background:var(--raise);border:1px solid var(--line)}
input[type=checkbox]{appearance:none;width:22px;height:22px;border:2px solid var(--line);border-radius:50%;cursor:pointer;margin:0;display:grid;place-content:center;background:var(--surface);transition:border-color .15s}
input[type=checkbox]:hover{border-color:var(--green)}
input[type=checkbox]:checked{background:var(--green);border-color:var(--green)}
input[type=checkbox]:checked::after{content:"";width:5px;height:10px;border:solid var(--surface);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
@media (prefers-reduced-motion:no-preference){
  input[type=checkbox]:checked{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
  li.leaving{animation:out .45s ease forwards}
  @keyframes out{to{opacity:0;transform:translateX(14px)}}
}
.acts{display:flex;gap:6px;align-items:center;opacity:0;transition:opacity .15s}
li:hover .acts,li:focus-within .acts{opacity:1}
@media (hover:none){.acts{opacity:1}}
.acts button{padding:5px 9px;font-size:12px;background:transparent;border-radius:8px}
a.go{display:inline-flex;align-items:center;gap:4px;font:600 12px/1 var(--sans);padding:7px 10px;border-radius:99px;background:var(--ink);color:var(--lime);text-decoration:none;white-space:nowrap}
a.go:hover{box-shadow:0 0 0 3px rgba(184,240,74,.35)}
button.go{display:inline-flex;align-items:center;gap:4px;font:600 12px/1 var(--sans);padding:7px 10px;border-radius:99px;background:var(--ink);color:var(--lime);border:0;white-space:nowrap}
button.go:hover{box-shadow:0 0 0 3px rgba(184,240,74,.35)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;width:min(520px,calc(100% - 32px));background:var(--ink);color:var(--deck-fg);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
#toast p{margin:0;font-size:14px}
#toast textarea{width:100%;height:110px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:var(--deck-fg);font:12px/1.4 var(--mono);padding:8px;resize:vertical}
#toast .row{display:flex;gap:8px;flex-wrap:wrap}
#toast a{background:var(--lime);color:var(--ink);font-weight:600;text-decoration:none;padding:9px 14px;border-radius:10px}
#toast button{background:transparent;color:var(--deck-fg);border-color:rgba(255,255,255,.2)}
.empty{display:block!important;color:var(--muted);font-size:14px;padding:6px 8px;font-style:italic}
.empty:hover{background:transparent!important}

/* suggestions: glowing border */
#sugg{position:relative;border-radius:20px;padding:2px;background:conic-gradient(from var(--a,0deg),var(--lime),var(--green),transparent 40%,var(--lime) 60%,var(--green),var(--lime))}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@media (prefers-reduced-motion:no-preference){#sugg{animation:spin 6s linear infinite}@keyframes spin{to{--a:360deg}}}
#sugg .in{background:var(--surface);border-radius:18px;padding:16px 10px 10px}
#sugg h2 .spark{width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 10px var(--lime);align-self:center}
#sugg li{grid-template-columns:1fr auto}
#sugg .acts{opacity:1}
#sugg .add{background:var(--green);border-color:var(--green);color:var(--surface);font-weight:600}

.status{font-size:13px;color:var(--muted);margin:0 6px}
.status.err{color:var(--warn)}
details{padding:4px 8px}
details summary{cursor:pointer;color:var(--muted);font:500 12px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:8px 0}
@media (max-width:480px){.deck{padding:20px 16px 16px}.ring{width:80px;height:80px}.ring img{inset:8px;width:64px;height:64px}.stat b{font-size:26px}li{grid-template-columns:auto 1fr}li .acts{grid-column:2}#sugg li{grid-template-columns:1fr}#sugg li .acts{grid-column:1;justify-content:flex-start}}
</style>

<div class="wrap">
  <header class="deck">
    <div class="top">
      <div class="ring" aria-hidden="true">
        <svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="45"/><circle class="prog" id="prog" cx="50" cy="50" r="45"/></svg>
        <img id="avatar" alt="" hidden>
        <span class="pct" id="pct">0%</span>
      </div>
      <div class="hello">
        <div class="date" id="date"></div>
        <h1 id="greet">Hi there</h1>
      </div>
    </div>
    <p class="line" id="line">Loading your day…</p>
    <div class="stats">
      <div class="stat hot"><b id="s-today">0</b><span>Left today</span></div>
      <div class="stat"><b id="s-sugg">0</b><span>Suggested</span></div>
      <div class="stat"><b id="s-week">0</b><span>Done this week</span></div>
    </div>
  </header>

  <form id="add" autocomplete="off">
    <span class="plus" aria-hidden="true">+</span>
    <input id="newTitle" placeholder="What needs doing?" aria-label="New todo">
    <div class="seg" role="radiogroup" aria-label="When">
      <input type="radio" name="b" id="b-today" value="today" checked><label for="b-today">Today</label>
      <input type="radio" name="b" id="b-week" value="week"><label for="b-week">Week</label>
      <input type="radio" name="b" id="b-later" value="later"><label for="b-later">Later</label>
    </div>
    <button class="primary" type="submit">Add</button>
  </form>

  <p class="status" id="status" hidden></p>

  <section id="sugg" hidden><div class="in"><h2><span class="spark"></span>Suggested <span class="n" id="n-sugg"></span></h2><ul id="suggList"></ul></div></section>
  <section class="card"><h2>Today <span class="n" id="n-today"></span></h2><ul id="today"></ul></section>
  <section class="quiet"><h2>This week <span class="n" id="n-week"></span></h2><ul id="week"></ul></section>
  <section class="quiet"><h2>Later <span class="n" id="n-later"></span></h2><ul id="later"></ul></section>
  <details><summary id="doneSum">Done</summary><ul id="done"></ul></details>
</div>
<div id="toast" hidden role="status">
  <p id="toastMsg"></p>
  <textarea id="toastText" readonly aria-label="Prompt"></textarea>
  <div class="row"><a href="https://claude.ai/new" target="_blank" rel="noopener">Open new chat ↗</a><button type="button" onclick="document.getElementById('toast').hidden=true">Close</button></div>
</div>

<script>
const $=id=>document.getElementById(id);
const BUCKETS=["today","week","later"];
const NEXT={today:"week",week:"later",later:"today"};
const LABEL={today:"Week",week:"Later",later:"Today"};
const ART="__ARTIFACT_URL__"; // replaced with this page's own claude.ai URL after the first publish
let tasks=[], col=null, NAME="";

function greet(){
  const d=new Date(), h=d.getHours();
  $("date").textContent=d.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
  $("greet").innerHTML=(h<5?"Late night":h<12?"Morning":h<18?"Afternoon":"Evening")+(NAME?", <em>"+NAME+"</em>":"");
}
greet();
function startOfWeek(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()}

function goLink(t){
  const p=["Help me get this todo done now: "+t.title];
  if(t.source)p.push("Where it came from: "+t.source);
  if(t.plan)p.push("Plan: "+t.plan);
  p.push("Use my connected tools (email, Slack, meeting notes, calendar, CRM) to find the context and do the work. Prepare drafts and changes, but show me and get my OK before sending, posting or changing anything. When it's done, mark the todo done in my todo list artifact "+ART+" (collection tasks, doc_id "+t.id+", set done: true and doneAt to now).");
  const text=p.join("\n\n");
  const b=document.createElement("button");b.type="button";b.className="go";b.textContent="Do it ↗";b.title="Copy a prompt that starts this task in Claude";
  b.onclick=async()=>{let ok=false;try{await navigator.clipboard.writeText(text);ok=true}catch(e){}showToast(text,ok)};
  return b;
}
function showToast(text,ok){
  $("toastMsg").textContent=ok?"Prompt copied. Open a new chat and paste it.":"Copy this prompt, then open a new chat and paste it.";
  const ta=$("toastText");ta.value=text;ta.hidden=ok;$("toast").hidden=false;
  if(!ok){ta.focus();ta.select()}
}
function srcChip(t){const s=document.createElement("span");s.className="src";s.textContent=t.source;return s}

function render(){
  const sugg=tasks.filter(t=>t.suggested&&!t.dismissed).sort((a,c)=>(c.created||0)-(a.created||0));
  $("sugg").hidden=!sugg.length; $("n-sugg").textContent=sugg.length?sugg.length+" NEW":"";
  fillSugg(sugg);
  const real=tasks.filter(t=>!t.suggested&&!t.dismissed);
  const open=real.filter(t=>!t.done), done=real.filter(t=>t.done);
  for(const b of BUCKETS){
    const list=open.filter(t=>(t.bucket||"today")===b).sort((a,c)=>(a.created||0)-(c.created||0));
    $("n-"+b).textContent=list.length?list.length+" OPEN":"";
    fill($(b),list,b==="today"?"Clear runway. Pull something up from below.":"Nothing here.");
  }
  const d=done.sort((a,c)=>(c.doneAt||0)-(a.doneAt||0)).slice(0,50);
  $("doneSum").textContent="Done · "+done.length;
  fill($("done"),d,"Nothing done yet");
  const todayOpen=open.filter(t=>(t.bucket||"today")==="today").length;
  const sod=new Date();sod.setHours(0,0,0,0);
  const doneToday=done.filter(t=>(t.doneAt||0)>=sod.getTime()).length;
  const wk=done.filter(t=>(t.doneAt||0)>=startOfWeek()).length;
  $("s-today").textContent=todayOpen; $("s-sugg").textContent=sugg.length; $("s-week").textContent=wk;
  const tot=todayOpen+doneToday, pct=tot?Math.round(doneToday/tot*100):0;
  $("prog").style.strokeDashoffset=283-283*pct/100; $("pct").textContent=pct+"%";
  $("line").innerHTML=!tot?"Nothing planned for today yet. Add one above or grab a suggestion."
    :todayOpen===0?"<b>All of today is done.</b> Nice work."
    :"<b>"+doneToday+" of "+tot+"</b> done today. "+(todayOpen===1?"One to go.":todayOpen+" to go.");
}
function fill(ul,list,emptyText){
  ul.replaceChildren();
  if(!list.length){const p=document.createElement("li");p.className="empty";p.textContent=emptyText;ul.append(p);return}
  for(const t of list){
    const li=document.createElement("li"); if(t.done) li.className="done";
    const cb=document.createElement("input"); cb.type="checkbox"; cb.checked=!!t.done; cb.id="cb-"+t.id;
    cb.setAttribute("aria-label","Mark done: "+t.title);
    cb.onchange=()=>{const v=cb.checked;if(v)li.classList.add("leaving");setTimeout(()=>save(t.id,{done:v,doneAt:v?Date.now():null}),v?380:0)};
    const sp=document.createElement("label"); sp.className="t"; sp.htmlFor=cb.id; sp.textContent=t.title;
    if(t.plan&&!t.done){const s=document.createElement("span");s.className="plan";s.textContent=t.plan;sp.append(s)}
    if(t.source&&!t.done){sp.append(document.createElement("br"),srcChip(t))}
    const acts=document.createElement("div"); acts.className="acts";
    if(!t.done){acts.append(goLink(t));
      const mv=document.createElement("button");mv.type="button";mv.textContent="→ "+LABEL[t.bucket||"today"];mv.title="Move";
      mv.onclick=()=>save(t.id,{bucket:NEXT[t.bucket||"today"]});acts.append(mv)}
    const del=document.createElement("button");del.type="button";del.textContent="✕";del.title="Delete";del.setAttribute("aria-label","Delete "+t.title);
    del.onclick=()=>{if(del.dataset.armed){remove(t.id)}else{del.dataset.armed=1;del.textContent="Delete?";setTimeout(()=>{del.dataset.armed="";del.textContent="✕"},2500)}};
    acts.append(del);
    li.append(cb,sp,acts); ul.append(li);
  }
}
function fillSugg(list){
  const ul=$("suggList"); ul.replaceChildren();
  for(const t of list){
    const li=document.createElement("li");
    const sp=document.createElement("div"); sp.className="t"; sp.style.cursor="default"; sp.textContent=t.title;
    if(t.plan){const s=document.createElement("span");s.className="plan";s.textContent=t.plan;sp.append(s)}
    if(t.source){sp.append(document.createElement("br"),srcChip(t))}
    const acts=document.createElement("div"); acts.className="acts";
    const add=document.createElement("button");add.type="button";add.className="add";add.textContent="Add";
    add.onclick=()=>save(t.id,{suggested:false,created:Date.now()});
    const no=document.createElement("button");no.type="button";no.textContent="Dismiss";
    no.onclick=()=>save(t.id,{dismissed:true});
    acts.append(add,goLink(t),no); li.append(sp,acts); ul.append(li);
  }
}
function status(msg,err){const s=$("status");s.textContent=msg||"";s.hidden=!msg;s.className="status"+(err?" err":"")}
async function save(id,patch){try{await col.doc(id).update(patch)}catch(e){status("Couldn't save that change. Check your connection and try again.",true);render()}}
async function remove(id){try{await col.doc(id).delete()}catch(e){status("Couldn't delete that todo. Try again.",true)}}

$("add").addEventListener("submit",async e=>{
  e.preventDefault();
  const title=$("newTitle").value.trim(); if(!title||!col) return;
  const bucket=document.querySelector('input[name=b]:checked').value;
  const id="t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  $("newTitle").value="";
  try{await col.doc(id).set({title,bucket,done:false,created:Date.now()})}
  catch(err){$("newTitle").value=title;status("Couldn't add that todo. Try again.",true)}
});

(async()=>{const user=await claude.use("user");if(!user)return;try{const me=await user.me();if(me){NAME=(me.name||"").split(" ")[0].replace(/[<>&"']/g,"");greet();if(me.avatarUrl){$("avatar").src=me.avatarUrl;$("avatar").hidden=false}}}catch(e){}})();
render(); $("line").textContent="Loading your day…";
(async()=>{
  const timer=setTimeout(()=>status("Still loading. If this stays, reopen the page.",true),10000);
  const db=await claude.use("db");
  if(!db){clearTimeout(timer);status("Sign in to claude.ai to load your list.",true);$("add").hidden=true;return}
  col=db.collection("tasks");
  col.onSnapshot(snap=>{
    clearTimeout(timer);
    tasks=snap.docs.map(d=>({id:d.id,...d.data()}));
    status(""); render();
  },err=>{clearTimeout(timer);status("Couldn't load your list. Reopen the page to retry.",true)});
})();
</script>
